# nginx/nginx.conf - Tutorial 06: Strangler Pattern

# formato de log que muestra a que backend se mando cada peticion
# (backend = nombre del upstream, upstream = ip:puerto del contenedor)
log_format strangler '$remote_addr [$time_local] "$request" $status '
                     'backend=$proxy_host upstream=$upstream_addr';

upstream django_v1 {
    server web_django:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log strangler;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA VIEJA: Sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
    }

    # RUTA NUEVA: Estrangulamos la funcion de compra y la mandamos a Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
    }

    # archivos estaticos (css de DRF) los sirve Nginx directo
    location /static/ {
        alias /app/staticfiles/;
    }

    # lo demas del monolito (inventario, compra html) sigue en Django
    location / {
        proxy_pass http://django_v1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
